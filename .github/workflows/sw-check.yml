name: sw-check
on:
  push:
  pull_request:
jobs:
  sw-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild sw.js
        run: node tools/build-sw.js
      - name: Fail if sw.js is stale
        run: git diff --exit-code -- sw.js
